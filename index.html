<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapToTon Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase SDK JS Bundle -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .tap-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: #0088cc;
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.5);
            transition: transform 0.1s;
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
        .score {
            font-size: 32px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TapToTon</h1>
        <p id="user-display">Loading User...</p>
        <div class="score">Points: <span id="points">0</span></div>
        <button class="tap-btn" id="tap-btn">TAP!</button>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Supabase Setup
        const SUPABASE_URL = "https://gnqevgdnkwizeegiwsdc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImducWV2Z2Rua3dpemVlZ2l3c2RjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDkyMDIsImV4cCI6MjEwNDk4NTIwMn0.W4U4_AhCfmYc4lWAjiIZj1VAGfcFWxBUts4UmjKoHZI";
        
        let supabaseClient;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // Get Telegram User
        let user = tg.initDataUnsafe?.user || { id: 123456, username: "TestUser", first_name: "Test" };
        let currentPoints = 0;

        // Display Username
        const usernameText = user.username ? `@${user.username}` : (user.first_name || 'User');
        document.getElementById('user-display').innerText = usernameText;

        // Fetch User Data from Supabase
        async function loadUserData() {
            if (!supabaseClient) return;

            try {
                let { data, error } = await supabaseClient
                    .from('users')
                    .select('points')
                    .eq('id', user.id)
                    .maybeSingle();

                if (data) {
                    currentPoints = data.points || 0;
                    document.getElementById('points').innerText = currentPoints;
                } else {
                    // Create new record for new user
                    await supabaseClient.from('users').upsert([
                        { id: user.id, username: usernameText, points: 0 }
                    ]);
                }
            } catch (err) {
                console.error("Error loading user data:", err);
            }
        }

        // Save Points to Supabase
        async function savePoints(newPoints) {
            if (!supabaseClient) return;

            try {
                await supabaseClient
                    .from('users')
                    .upsert([
                        { id: user.id, username: usernameText, points: newPoints }
                    ]);
            } catch (err) {
                console.error("Error saving points:", err);
            }
        }

        // Tap Event Handling
        const tapBtn = document.getElementById('tap-btn');
        let saveTimeout;

        tapBtn.addEventListener('click', () => {
            currentPoints += 1;
            document.getElementById('points').innerText = currentPoints;

            // Save points 1 second after last tap
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                savePoints(currentPoints);
            }, 1000);
        });

        // Initialize Data
        loadUserData();
    </script>
</body>
</html>
