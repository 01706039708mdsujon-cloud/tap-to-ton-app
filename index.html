<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapToTon Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
        }

        .header {
            padding: 15px;
            text-align: center;
            background: var(--card-bg);
            border-bottom: 1px solid #334155;
        }

        .user-card {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .score-title {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 42px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 5px;
        }

        .tap-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%);
            border: 8px solid rgba(56, 189, 248, 0.2);
            color: white;
            font-size: 28px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            outline: none;
        }

        .tap-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        /* Referral Box UI */
        .ref-box {
            background: var(--card-bg);
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 15px;
        }

        .ref-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-color);
        }

        .btn-action {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        /* Bottom Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-around;
            background-color: var(--card-bg);
            border-top: 1px solid #334155;
            padding: 10px 0;
        }

        .nav-item {
            color: var(--text-secondary);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            flex: 1;
        }

        .nav-item.active {
            color: var(--accent-color);
            font-weight: bold;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-card" id="user-display">Loading User...</div>
    </div>

    <div class="main-content">
        <!-- Tap/Earn Tab -->
        <div id="tab-earn" class="tab-content active">
            <div class="score-card">
                <div class="score-title">Balance</div>
                <div class="score-value" id="points">0</div>
            </div>
            <button class="tap-btn" id="tap-btn">TAP!</button>
        </div>

        <!-- Referral Tab -->
        <div id="tab-ref" class="tab-content">
            <div class="ref-box">
                <div class="ref-title">Invite Friends!</div>
                <p style="font-size: 14px; color: var(--text-secondary);">
                    Earn <b>+500 points</b> for each friend you invite. Your friend gets <b>+200 startup bonus</b>!
                </p>
                <button class="btn-action" id="share-ref-btn">Share Invite Link</button>
            </div>
        </div>

        <!-- Wallet/Tasks Tab -->
        <div id="tab-tasks" class="tab-content">
            <div class="ref-box">
                <div class="ref-title">Tasks & Airdrop</div>
                <p style="font-size: 14px; color: var(--text-secondary);">
                    Complete tasks to earn extra points. TON Airdrop coming soon!
                </p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('earn')">
            <span class="nav-icon">⚡</span>
            <span>Earn</span>
        </div>
        <div class="nav-item" onclick="switchTab('ref')">
            <span class="nav-icon">👥</span>
            <span>Friends</span>
        </div>
        <div class="nav-item" onclick="switchTab('tasks')">
            <span class="nav-icon">🏆</span>
            <span>Tasks</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const SUPABASE_URL = "https://gnqevgdnkwizeegiwsdc.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImducWV2Z2Rua3dpemVlZ2l3c2RjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDkyMDIsImV4cCI6MjEwNDk4NTIwMn0.W4U4_AhCfmYc4lWAjiIZj1VAGfcFWxBUts4UmjKoHZI";
        
        let supabaseClient;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        let user = tg.initDataUnsafe?.user || { id: 123456, username: "TestUser", first_name: "Test" };
        let startParam = tg.initDataUnsafe?.start_param || ""; // Captures referral start param
        let currentPoints = 0;

        const usernameText = user.username ? `@${user.username}` : (user.first_name || 'User');
        document.getElementById('user-display').innerText = usernameText;

        // Switch Tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Fetch / Register User with Referral Logic
        async function loadUserData() {
            if (!supabaseClient) return;

            try {
                let { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('id', user.id)
                    .maybeSingle();

                if (data) {
                    currentPoints = data.points || 0;
                    document.getElementById('points').innerText = currentPoints;
                } else {
                    let initialPoints = 0;
                    let referrerId = null;

                    // Check if came through referral (e.g., ref_123456)
                    if (startParam && startParam.startsWith("ref_")) {
                        referrerId = parseInt(startParam.replace("ref_", ""));
                        if (referrerId !== user.id) {
                            initialPoints = 200; // New user bonus
                            // Give referrer bonus points (+500)
                            await rewardReferrer(referrerId);
                        }
                    }

                    await supabaseClient.from('users').insert([
                        { id: user.id, username: usernameText, points: initialPoints, referred_by: referrerId }
                    ]);

                    currentPoints = initialPoints;
                    document.getElementById('points').innerText = currentPoints;
                }
            } catch (err) {
                console.error("Error loading user data:", err);
            }
        }

        // Reward Referrer +500 points
        async function rewardReferrer(refId) {
            try {
                let { data } = await supabaseClient.from('users').select('points').eq('id', refId).single();
                if (data) {
                    let updatedPoints = (data.points || 0) + 500;
                    await supabaseClient.from('users').update({ points: updatedPoints }).eq('id', refId);
                }
            } catch (err) {
                console.error("Error rewarding referrer:", err);
            }
        }

        // Save Points
        async function savePoints(newPoints) {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('users').update({ points: newPoints }).eq('id', user.id);
            } catch (err) {
                console.error("Error saving points:", err);
            }
        }

        // Tap Mechanics
        const tapBtn = document.getElementById('tap-btn');
        let saveTimeout;

        tapBtn.addEventListener('click', () => {
            currentPoints += 1;
            document.getElementById('points').innerText = currentPoints;

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                savePoints(currentPoints);
            }, 1000);
        });

        // Referral Share Button
        document.getElementById('share-ref-btn').addEventListener('click', () => {
            // Replace 'YOUR_BOT_USERNAME' with your actual bot username
            const botUsername = "TapToTonBD_bot"; 
            const refLink = `https://t.me/${botUsername}?start=ref_${user.id}`;
            const shareText = `Join TapToTon and get 200 free points! 🚀`;
            const fullUrl = `https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(shareText)}`;
            
            tg.openTelegramLink(fullUrl);
        });

        // Init App
        loadUserData();
    </script>
</body>
</html>
